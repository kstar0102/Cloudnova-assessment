[project]
name = "cloudnova-ask"
version = "0.1.0"
description = "CloudNova invoice ledger: spec-driven cleaning pipeline + natural-language query layer"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "duckdb>=1.1,<1.5",  # 1.5+ wheels need AVX2 (crashes on AVX-only CPUs)
    "sqlglot>=25",
    "anthropic>=0.70",
    "pydantic>=2",
    "python-dotenv>=1",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app", "evals"]

[tool.pytest.ini_options]
testpaths = ["tests"]
